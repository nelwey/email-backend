services:
  postgres:
    image: postgres:16-alpine
    container_name: email-editor-postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_password}
      POSTGRES_DB: ${POSTGRES_DB:-email_editor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-email_user} -d ${POSTGRES_DB:-email_editor}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
